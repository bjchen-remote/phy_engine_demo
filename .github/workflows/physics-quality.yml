name: Physics project checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  python39-engine:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install optional test dependencies
        run: python -m pip install 'jsonschema>=4,<5' 'PyYAML>=6,<7'
      - name: Run Python 3.9 compatibility regressions on Intel
        run: python tests/ci_python39_intel.py

  arm64-release:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional test dependencies
        run: python -m pip install 'jsonschema>=4,<5' 'PyYAML>=6,<7'
      - name: Install PCB video encoder
        run: brew install ffmpeg
      - name: Run engine regressions
        run: python -m unittest discover -s tests -q
      - name: Run toolbox regressions, including sandbox video acceptance
        run: python -m unittest discover -s toolboxes/tests -q
      - name: Verify embedded release
        run: python toolboxes/build_physics.py --check
